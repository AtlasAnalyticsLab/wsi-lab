[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-lab"
version = "0.1.0"
description = "Recurrent reinforcement learning for sequential whole-slide image examination"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "WSI Lab contributors"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5.1,<3",
  "torchvision>=0.20",
  "gymnasium>=1.1,<2",
  "openslide-python>=1.4",
  "h5py>=3.11",
  "tifffile>=2024.8",
  "imagecodecs>=2024.9",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0",
  "Pillow>=10",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "tensorboard>=2.17",
  "matplotlib>=3.9",
  "psutil>=6",
  "tqdm>=4.66",
  "atlas-patch==1.1.0",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
]
wandb = ["wandb>=0.19"]

[project.scripts]
wsi-lab = "wsi_lab.cli:main"

[project.entry-points."gymnasium.envs"]
WSILab-v0 = "wsi_lab.envs:make_env"

[tool.setuptools.packages.find]
where = ["src"]

# Preserve project-facing environment, configuration, and documentation
# assets in wheels as well as source distributions. Setuptools installs these
# below <sys.prefix>/share/wsi-lab.
[tool.setuptools.data-files]
"share/wsi-lab" = ["README.md", "environment.yml"]
"share/wsi-lab/configs" = ["configs/*.yaml"]
"share/wsi-lab/docs" = ["docs/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/real"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "real: requires the local CAMELYON16 dataset",
  "gpu: requires a CUDA-capable GPU",
  "slow: intentionally expensive test",
  "atlaspatch: invokes AtlasPatch and may download model weights",
]
